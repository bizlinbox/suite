<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="BizlInbox - WhatsApp Business Platform">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="BizlInbox">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="icons/Icon-192.png"/>

  <title>BizlInbox</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #002E6A;
    }

    #flutter-loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #002E6A;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }

    #flutter-loading.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .loading-logo {
      width: 64px;
      height: 64px;
      margin-bottom: 24px;
      border-radius: 16px;
      object-fit: contain;
    }

    .loading-text {
      color: #94a3b8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 16px;
    }

    .progress-track {
      width: 240px;
      height: 4px;
      background: #1e293b;
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-fill {
      width: 100%;
      height: 100%;
      background: #128C7E;
      border-radius: 2px;
      animation: loading-slide 1.5s ease-in-out infinite;
      transform-origin: left;
    }

    @keyframes loading-slide {
      0% {
        transform: translateX(-100%) scaleX(0.3);
      }
      50% {
        transform: translateX(0%) scaleX(0.5);
      }
      100% {
        transform: translateX(200%) scaleX(0.3);
      }
    }
  </style>
</head>
<body>
  <div id="flutter-loading">
    <img class="loading-logo" src="icons/Icon-192.png" alt="BizlInbox" />
    <div class="loading-text">Loading BizlInbox...</div>
    <div class="progress-track">
      <div class="progress-fill"></div>
    </div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('flutter-loading');
      if (loader) {
        loader.classList.add('fade-out');
        setTimeout(function () {
          if (loader && loader.parentNode) {
            loader.parentNode.removeChild(loader);
          }
        }, 400);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
